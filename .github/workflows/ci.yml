name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check Python syntax compilation
        run: python -m compileall scripts tests

      - name: Run test suite
        run: python -m unittest discover -s tests -v

  # Single stable check for branch protection. Keeps the required status
  # check name fixed even when the test matrix changes.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Verify matrix result
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Test matrix did not succeed: ${{ needs.test.result }}"
            exit 1
          fi
          echo "All matrix jobs passed."
